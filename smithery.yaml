startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      walletPrivateKey:
        type: string
        description: >-
          Dedicated low-balance Base wallet private key for x402 USDC
          micropayments. Required — every tool in this package is paid
          (prices $0.001-$0.02). Never use your primary wallet.
    required:
      - walletPrivateKey
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@forgemeshlabs/library-mcp'],
      env: {
        WALLET_PRIVATE_KEY: config.walletPrivateKey
      }
    })
  exampleConfig:
    walletPrivateKey: '0x...'
